version: '3.8'

services:
  backend:
    build: ./backend
    container_name: daparpangan-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://daparpangan:zephyrus123@db:5432/daparpangan
      - CORS_ORIGINS=["*"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    container_name: daparpangan-db
    environment:
      - POSTGRES_USER=daparpangan
      - POSTGRES_PASSWORD=zephyrus123
      - POSTGRES_DB=daparpangan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daparpangan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
