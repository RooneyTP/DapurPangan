<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DapurPangan</title>
    <link rel="icon" type="image/svg+xml" href="../Image/Logo/Logo DapurPangan.svg">
    <link rel="stylesheet" href="../CSS/AI Dashboard.css">
</head>

<body>
    <div id="app-layout">

        <div id="Sidebar">
            <div id="header-siderbar">
                <img src="../Image/Logo/Logo DapurPangan.svg" alt="Logo DapurPangan" style="height: 53px; width: 53px;">
                <div id="header-siderbar-teks">
                    <h3>DapurPangan</h3>
                    <p>AI Dashboard</p>
                </div>
            </div>

            <div id="isi-sidebar">
                <div class="isi aktif">
                    <img src="../Image/Dashboard AI/Message square.svg" alt="message" style="height: 24px; width: 24px;">
                    <a href="#ai-chat">AI Chat</a>
                </div>

                <div class="isi">
                    <img src="../Image/Dashboard AI/Tag.svg" alt="Harga" style="height: 24px; width: 24px;">
                    <a href="#rekomendasi-harga">Rekomendasi Harga</a>
                </div>

                <div class="isi">
                    <img src="../Image/Dashboard AI/Package.svg" alt="Stok" style="height: 24px; width: 24px;">
                    <a href="#stok-bahan">Stok Bahan</a>
                </div>

                <div class="isi">
                    <img src="../Image/Dashboard AI/Shopping cart.svg" alt="Pesanan & Pelanggan" style="height: 24px; width: 24px;">
                    <a href="#pesanan-pelanggan">Pesanan & Pelanggan</a>
                </div>

            </div>

            <div id="kembali">
                <div id="kembali-teks">
                    <img src="../Image/Tanda-Panah.svg" alt="panah-kembali" style="rotate: 180deg; height: 15px; width: 15px;">
                    <a href="../HTML/index.html">Kembali</a>
                </div>
            </div>
        </div>

        <div id="main-frame">
            <div id="ai-chat" class="page-content">
                <div class="page-title">
                    <h4>AI Chat</h4>
                </div>
            </div>
            
            <div id="rekomendasi-harga" class="page-content">
                <div class="page-title">
                    <h4>Rekomendasi Harga</h4>
                </div>
            </div>

            <div id="stok-bahan" class="page-content">
                <div class="page-title">
                    <h4>Stok Bahan</h4>
                </div>
            </div>

            <div id="pesanan-pelanggan" class="page-content">
                <div class="page-title">
                    <h4>Pesanan & Pelanggan</h4>
                </div>
            </div>
        </div>
    </div>

    <script src="../JS/script.js">

    </script>
</body>

</html>
